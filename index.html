<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Daily Dhun</title>
  <script>
    // YouTube links for Monday to Friday
    const links = [
      "", // 0 = Sunday (no video)
      "https://www.youtube.com/live/Y6kxLqbEEl4?si=81_W2Fia9kiMZPWE", // 1 = Monday
      "https://youtu.be/9Ix8GXiqDPA?si=BunUzBrgY6MFMsH1", // 2 = Tuesday
      "https://youtu.be/9Ix8GXiqDPA?si=BunUzBrgY6MFMsH1", // 3 = Wednesday
      "https://www.youtube.com/watch?v=SX_d5ZUDweA", // 4 = Thursday
      "https://youtube.com/premiere5", // 5 = Friday
      ""  // 6 = Saturday (no video)
    ];

    // Get today’s weekday (0 = Sunday, 1 = Monday, …)
    const today = new Date().getDay();

    // Redirect to today’s video if it exists
    if (links[today]) {
      window.location.href = links[today];
    } else {
      document.body.innerHTML = "No video today. See you tomorrow!";
    }
  </script>
</head>
<body>
  Redirecting to today's video...
</body>
</html>
